name: Publish phone story website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Prepare static website
        run: |
          python3 make_demo.py
          python3 make_bundle.py
          mkdir _site
          cp demo.html demo.webmanifest demo-story.js index.html studio.html play.html app.js style.css portal.js manifest.webmanifest app-icon.svg kun-template.json mom-template.json experience.js experience.css local-ollama.zip .nojekyll _site/
          test -s _site/index.html
          test -s _site/studio.html
          node --check _site/app.js
          node --check _site/experience.js
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
